mkRibbon(0x4fffbf,0x9f6fff,15,4.2,8,0,.6);mkRibbon(0x4fffbf,0x9f6fff,16,4.2,20,1,.4);
function updateAurora(dt){
  const m=maxY*3,i=Math.max(0,Math.min(1,(m-1000)/100)),o=Math.max(0,Math.min(1,(1500-m)/100)),k=Math.min(i,o),op=k*k*(3-2*k)*AURORA_BRIGHT;
  if(!AURORA_ON||op<=.001){aurora.visible=false;return}
  aurora.visible=true;aurora.position.set(0,camY+1.6,-35);
  aMats.forEach(a=>{a.m.uniforms.uTime.value=time;a.m.uniforms.uOpacity.value=op*a.mult})
}
function updateCity(dt){
  city.visible=camY<500;
  city.position.y=camY*.91-15.4;
}

function shareResult(){
  const m=Math.floor(maxY*3);
  const text='Я пролетел '+m+' м в Chicken Hop! Попробуй побить мой рекорд 🐔';
  const url=location.href;
  if(navigator.share){navigator.share({title:'Chicken Hop',text,url}).catch(()=>{})}
  else{try{navigator.clipboard.writeText(text+' '+url).then(()=>cap('Скопировано!')).catch(()=>{})}catch(e){}}
}
$('shareBtn').addEventListener('click',shareResult);
function updateFarClouds(){
  const m=maxY*3,af=m<=1200?1:m>=1500?0:1-(m-1200)/300;
  if(af<=0){far.forEach(g=>{g.visible=false});return}
  const fl=city.visible?city.position.y:-1e9;
  far.forEach(g=>{const f=Math.max(0,Math.min(1,(g.position.y-fl-1)/10))*af;g.visible=f>0&&!g.userData.qOff;if(f>0)g.children[0].material.opacity=.3*f})
}
const debrisGroup=new THREE.Group();scene.add(debrisGroup);
let DEBRIS_ON=true;const DEBRIS_SCALE=2;
let debris=[],debrisT=rnd(1.5,3)*QF;
const dmats=[0x8a8a95,0x5a5a65,0x8a6a55].map(c=>new THREE.MeshStandardMaterial({color:c,metalness:.6,roughness:.5,transparent:true,opacity:0}));
const dg={panel:new THREE.BoxGeometry(.6,.05,.4),cube:new THREE.BoxGeometry(.3,.3,.3),ant:new THREE.CylinderGeometry(.012,.012,.5,5),pipe:new THREE.CylinderGeometry(.15,.15,.5,8),hull:new THREE.DodecahedronGeometry(.2),shard:new THREE.SphereGeometry(.1,8,6)};
function clearDebris(){debris.forEach(d=>debrisGroup.remove(d.o));debris=[]}
function spawnDebris(){
  const t=Math.floor(rnd(0,5)),mat=dmats[Math.random()<.2?2:Math.random()<.5?0:1];let o;
  if(t==0)o=new THREE.Mesh(dg.panel,mat);
  else if(t==1){o=new THREE.Group();o.add(new THREE.Mesh(dg.cube,mat));[[.3,0,0,0,0,1.57],[0,.3,0,0,0,0],[0,0,.3,1.57,0,0]].forEach(([x,y,z,rx,ry,rz])=>{const a=new THREE.Mesh(dg.ant,mat);a.position.set(x,y,z);a.rotation.set(rx,ry,rz);o.add(a)})}
  else if(t==2)o=new THREE.Mesh(dg.pipe,mat);
  else if(t==3)o=new THREE.Mesh(dg.hull,mat);
  else o=new THREE.Mesh(dg.shard,mat);
  const hw=hwAt(-45),hh=hhAt(-45),side=Math.floor(rnd(0,3)),sp=()=>rnd(.3,.8)*(Math.random()<.5?-1:1);
  let x,y,vx,vy;
  if(side==0){x=rnd(-hw*.9,hw*.9);y=hh*.95;vx=sp();vy=-rnd(.2,.6)}
  else if(side==1){x=-hw*.95;y=rnd(-.2,.9)*hh;vx=rnd(.3,.8);vy=sp()}
  else{x=hw*.95;y=rnd(-.2,.9)*hh;vx=-rnd(.3,.8);vy=sp()}
  o.scale.setScalar(DEBRIS_SCALE*rnd(.8,1.4));o.rotation.set(rnd(0,6),rnd(0,6),rnd(0,6));debrisGroup.add(o);
  const rs=()=>rnd(.2,1)*(Math.random()<.5?-1:1);
  debris.push({o,x,y,vx,vy,rx:rs(),ry:rs(),rz:rs()});
}
function updateDebris(dt){
  const m=maxY*3,f=m<=1200?0:m>=1500?1:(m-1200)/300;
  if(!DEBRIS_ON||f<=0){if(debris.length)clearDebris();debrisGroup.visible=false;return}
  debrisGroup.visible=true;dmats.forEach(x=>{x.opacity=f});
  debrisT-=dt;if(debrisT<=0&&debris.length<DEB_MAX){spawnDebris();debrisT=rnd(1.5,3)*QF}
  const hw=hwAt(-45),hh=hhAt(-45);
  for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.x+=d.vx*dt;d.y+=d.vy*dt;
    if(Math.abs(d.x)>hw+2||d.y>hh+2||d.y<-hh-2){debrisGroup.remove(d.o);debris.splice(i,1);continue}
    d.o.position.set(d.x,camY+1.6+d.y,-45);d.o.rotation.x+=d.rx*dt;d.o.rotation.y+=d.ry*dt;d.o.rotation.z+=d.rz*dt}
}
const nebulaGroup=new THREE.Group();nebulaGroup.visible=false;scene.add(nebulaGroup);
let NEBULA_ON=true;
function mkNebTex(a,b){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const blob=(x,y,r,col)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col+'99');gr.addColorStop(.5,col+'44');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.fillRect(0,0,256,256)};
  blob(128,128,120,a);blob(95+rnd(-20,20),110+rnd(-20,20),80,b);blob(160+rnd(-20,20),150+rnd(-20,20),70,a);blob(120+rnd(-30,30),130+rnd(-30,30),60,b);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
const nebulas=[['#ff4488','#8844ff',-12,rnd(-15,15)],['#4488ff','#44ddff',-10,rnd(-15,15)],['#44ff88','#4488ff',12,rnd(-15,15)],['#ff4488','#ffaa44',10,rnd(-15,15)],['#8844ff','#4488ff',0,rnd(9,15)]].map(([a,b,x,off])=>{
  const w=rnd(25,40),mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,w*rnd(.7,1)),new THREE.MeshBasicMaterial({map:mkNebTex(a,b),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false,fog:false}));
  mesh.renderOrder=-4;mesh.frustumCulled=false;nebulaGroup.add(mesh);return{mesh,x,off,ph:rnd(0,6.28)}});
function updateNebula(dt){
  const m=maxY*3,f=m<=1600?0:m>=1800?1:(m-1600)/200;
  if(!NEBULA_ON||f<=0){nebulaGroup.visible=false;return}
  nebulaGroup.visible=true;
  nebulas.forEach((n,i)=>{n.mesh.visible=n.mesh.userData.q!==false;n.mesh.position.set(n.x,camY+1.6+n.off,-58);n.mesh.material.opacity=f*(.5+.1*Math.sin(time*.4+n.ph))})
}
const HT=[
  {i:'👆',t:'Управление',d:'Держи палец слева или справа от центра — птица летит в эту сторону.'},
  {i:'☁️',t:'Прыгай по облакам',d:'Птица прыгает сама при касании облака. Белое — обычное, голубое — движется, серое — рассыпается, розовое — подбрасывает выше.'},
  {i:'🪶',t:'Собирай перья',d:'Перья дают опыт и деньги. Опыт открывает уровни, перья тратятся в магазине.'},
  {i:'⚔️',t:'Берегись врагов',d:'Ястребы атакуют. Уклоняйся. На каждом 400м, 1000м и 1900м — босс.'},
  {i:'🔥',t:'Комбо',d:'Прыгай по облакам без промаха — растёт комбо. Чем больше, тем больше наград.'}
];
function renderHowTo(){
  let h='';
  HT.forEach(c=>{h+='<div class="htCard"><div class="htIcon">'+c.i+'</div><div class="htText"><b>'+tr(c.t)+'</b>'+tr(c.d)+'</div></div>'});
  $('htlist').innerHTML=h;$('hth').textContent=tr('Как играть');$('htback').textContent=tr('Понятно');
}
$('howb').addEventListener('click',()=>{renderHowTo();$('howto').classList.remove('hide')});
$('htback').addEventListener('click',()=>{$('howto').classList.add('hide');save.seenHow=1;persist()});
const autoGuess=()=>((navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=3)?2:3;
function applyQuality(level){
  const L=level===1,M=level===2;
  R.setPixelRatio(L?1:M?Math.min(devicePixelRatio,1.5):Math.min(devicePixelRatio,2));
  if(R.shadowMap.enabled!==!L){R.shadowMap.enabled=!L;scene.traverse(o=>{const m=o.material;if(m)(Array.isArray(m)?m:[m]).forEach(x=>{x.needsUpdate=true})})}
  const ms=M?512:1024;
  if(sun.shadow.mapSize.x!==ms){sun.shadow.mapSize.set(ms,ms);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  METEORS_ON=DEBRIS_ON=NEBULA_ON=AURORA_ON=!L;
  QF=M?1.6:1;DEB_MAX=M?5:9;PT_MAX=L?18:M?28:36;
  far.forEach((g,i)=>{g.userData.qOff=i>=(L?4:M?6:8)});
  nebulas.forEach((n,i)=>{n.mesh.userData.q=!M||i<3});
  resize();
}
let qDone=save.quality!==0,qm={t:0,n:0,w:0};
function qMeasure(raw){
  if(qDone||st==='menu'||st==='over')return;
  raw=Math.min(raw,.5);
  if(qm.w<.5){qm.w+=raw;return}
  qm.t+=raw;qm.n++;
  if(qm.t>=3){const fps=qm.n/qm.t,lv=fps<30?1:fps<50?2:3;save.quality=lv;persist();qDone=true;applyQuality(lv)}
}
const QN=['Авто','Низкое','Среднее','Высокое'];let rstArm=0;
function renderSettings(){
  let h='<div class="stSec"><h3>'+tr('Качество графики')+'</h3><div class="qRow">';
  QN.forEach((n,i)=>{h+='<button data-q="'+i+'" class="'+(save.quality===i?'on':'')+'">'+tr(n)+'</button>'});
  h+='</div><div class="stHint">'+tr('Снизьте, если игра лагает')+'</div></div>';
  h+='<div class="stSec"><h3>'+tr('Звук')+'</h3><div class="tgRow"><span>'+tr('Музыка')+'</span><button data-mus="1" class="'+(musOff?'':'on')+'">'+tr(musOff?'Выкл':'Вкл')+'</button></div><div class="tgRow"><span>'+tr('Эффекты')+'</span><button data-sfx="1" class="'+(sfxOff?'':'on')+'">'+tr(sfxOff?'Выкл':'Вкл')+'</button></div></div>';
  h+='<div class="stSec"><h3>'+tr('Прогресс')+'</h3><button class="dng" data-reset="1">'+tr(rstArm?'Нажми ещё раз для сброса':'Сбросить прогресс')+'</button></div>';
  $('stlist').innerHTML=h;$('sth').textContent=tr('Настройки');$('stback').textContent=tr('Назад');
}
$('stlist').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.q!==undefined){const q=+t.dataset.q;save.quality=q;persist();qDone=q!==0;qm={t:0,n:0,w:0};applyQuality(q||autoGuess())}
  else if(t.dataset.mus){musOff=!musOff;save.musOff=musOff?1:0;persist()}
  else if(t.dataset.sfx){sfxOff=!sfxOff;save.sfxOff=sfxOff?1:0;persist();if(!sfxOff)snd(660,.12,'triangle')}
  else if(t.dataset.reset){
    if(rstArm){['ptashka3d-save','ptashka3d-best','ptashka3d-bk','ptashka3d-intro'].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}});location.reload();return}
    rstArm=1;setTimeout(()=>{rstArm=0;if(!$('settings').classList.contains('hide'))renderSettings()},3000)
  }
  renderSettings();
});
$('setb').addEventListener('click',()=>{renderSettings();$('settings').classList.remove('hide')});
$('stback').addEventListener('click',()=>$('settings').classList.add('hide'));
applyQuality(save.quality||autoGuess());
start(true);$('ov').classList.remove('hide');localize();
if(!save.seenHow)setTimeout(()=>{renderHowTo();$('howto').classList.remove('hide')},800);
let last=performance.now();
(function loop(t){const raw=(t-last)/1000,dt=Math.min(.033,raw);last=t;qMeasure(raw);step(dt);R.render(scene,cam);requestAnimationFrame(loop)})(last);
</script>
